version: '3.8'

services:
  vendoci-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      # Mount source code for live reloading
      - .:/app
      # Use named volume for tmp to avoid permission issues
      - vendoci-tmp:/app/tmp
      # Mount Go module cache
      - go-mod-cache:/go/pkg/mod
    environment:
      - CGO_ENABLED=0
      - GOOS=linux
      - GO111MODULE=on
    networks:
      - vendoci-network

  # Optional: Add a registry for testing
  registry:
    image: registry:2
    ports:
      - "5000:5000"
    environment:
      - REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY=/var/lib/registry
    volumes:
      - registry-data:/var/lib/registry
    networks:
      - vendoci-network

volumes:
  vendoci-tmp:
  go-mod-cache:
  registry-data:

networks:
  vendoci-network:
    driver: bridge