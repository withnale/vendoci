root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "./tmp/main"
  # ALL operations happen inside Docker containers
  cmd = "docker run --rm -v $(pwd):/workspace -w /workspace -e CGO_ENABLED=0 golang:1.21-alpine go build -o ./tmp/main ./cmd/vendoci"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", ".git"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  # Application execution also inside Docker
  full_bin = "docker run --rm -v $(pwd):/workspace -w /workspace --network host -e CGO_ENABLED=0 golang:1.21-alpine ./tmp/main"
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml"]
  include_file = []
  kill_delay = "2s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  rerun = false
  rerun_delay = 500
  send_interrupt = true
  stop_on_root = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true

# All Air operations will now run inside Docker containers:
# - Build: Uses golang:1.21-alpine container to compile
# - Run: Uses golang:1.21-alpine container to execute
# - File operations: Happen through volume mounts to /workspace
# - Network access: Uses host networking for registry access