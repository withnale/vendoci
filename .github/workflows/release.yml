name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release binaries
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          mkdir -p dist
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-X github.com/rhodesp/vendoci/pkg/cli.Version=${VERSION} -X github.com/rhodesp/vendoci/pkg/cli.CommitSHA=${COMMIT_SHA} -X github.com/rhodesp/vendoci/pkg/cli.BuildDate=${BUILD_DATE}"

          GOOS=darwin GOARCH=arm64 \
            go build -trimpath -ldflags "${LDFLAGS}" \
            -o dist/vendoci-darwin-arm64 ./cmd/vendoci

          GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "${LDFLAGS}" \
            -o dist/vendoci-linux-amd64 ./cmd/vendoci

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/vendoci-darwin-arm64
            dist/vendoci-linux-amd64
